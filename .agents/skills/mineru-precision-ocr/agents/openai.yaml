interface:
  display_name: "MinerU 精准 PDF 解析"
  short_description: "检查 MinerU MCP 后切分、解析并合并指定 PDF"
  default_prompt: "Use $mineru-precision-ocr to precisely parse the PDF file I explicitly specify."

dependencies:
  tools:
    - type: "mcp"
      value: "mineru"
      description: "Official MinerU MCP server for precision document parsing."
      transport: "stdio"

policy:
  allow_implicit_invocation: true
